  <rect x="820" y="140" width="400" height="140" fill="#FFFFFF" stroke="#090D16" stroke-width="2"/>
  <text x="840" y="170" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#090D16">Symbolic timeline</text>
