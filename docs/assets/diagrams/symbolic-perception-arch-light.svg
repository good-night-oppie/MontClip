  <line x1="330" y1="418" x2="190" y2="418" stroke="#F59E0B" stroke-width="2"/>
  <line x1="190" y1="418" x2="190" y2="294" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="190,284 184,296 196,296" fill="#F59E0B"/>
