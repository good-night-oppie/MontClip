<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="60" y="68" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#090D16">Inspect first. Request images when needed.</text>
  <text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#475569">Read project state as data; render frames only when the agent is visually uncertain.</text>
  <line x1="60" y1="118" x2="1220" y2="118" stroke="#090D16" stroke-width="1.5"/>

  <!-- Agent -->
  <rect x="60" y="140" width="200" height="140" fill="#FFFFFF" stroke="#090D16" stroke-width="2"/>
  <text x="80" y="180" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#090D16">Agent</text>
  <text x="80" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#334155">Reads state first</text>
  <text x="80" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#334155">Plans and patches</text>
  <text x="80" y="254" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#334155">Asks for frames</text>

  <!-- Agent <-> MCP arrows -->
  <line x1="262" y1="198" x2="328" y2="198" stroke="#090D16" stroke-width="2"/>
  <polygon points="338,198 326,192 326,204" fill="#090D16"/>
  <text x="300" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">call</text>
  <line x1="338" y1="226" x2="272" y2="226" stroke="#3B82F6" stroke-width="2"/>
  <polygon points="262,226 274,220 274,232" fill="#3B82F6"/>
  <text x="300" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B82F6">summary</text>

  <!-- MCP state inspection -->
  <rect x="340" y="140" width="400" height="140" fill="#FFFFFF" stroke="#090D16" stroke-width="2"/>
  <rect x="340" y="140" width="8" height="140" fill="#3B82F6"/>
  <text x="364" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#090D16">MCP state inspection</text>
  <text x="364" y="214" font-family="Menlo, Consolas, monospace" font-size="15" fill="#090D16">fablecut_get_project {compact:true}</text>
  <text x="364" y="248" font-family="Menlo, Consolas, monospace" font-size="15" fill="#090D16">fablecut_patch_project</text>

  <!-- MCP <-> Timeline arrows -->
  <line x1="742" y1="198" x2="808" y2="198" stroke="#090D16" stroke-width="2"/>
  <polygon points="818,198 806,192 806,204" fill="#090D16"/>
  <text x="780" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">patch</text>
