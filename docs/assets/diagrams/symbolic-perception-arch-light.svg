  <text x="716" y="420" font-family="Menlo, Consolas, monospace" font-size="14" fill="#090D16">fablecut_frame {path,t}</text>
  <rect x="716" y="434" width="76" height="44" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="722" y1="440" x2="734" y2="440" stroke="#F59E0B" stroke-width="2.5"/>
  <line x1="722" y1="440" x2="722" y2="450" stroke="#F59E0B" stroke-width="2.5"/>
  <line x1="786" y1="472" x2="774" y2="472" stroke="#F59E0B" stroke-width="2.5"/>
  <line x1="786" y1="472" x2="786" y2="462" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="806" y="452" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">One frame at time t</text>
  <text x="806" y="472" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">for a precise check</text>

