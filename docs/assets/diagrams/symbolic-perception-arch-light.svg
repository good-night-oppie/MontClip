  <rect x="520" y="586" width="36" height="34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <rect x="564" y="586" width="36" height="34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>

  <rect x="660" y="522" width="560" height="114" fill="#FFFFFF" stroke="#090D16" stroke-width="1.5"/>
  <text x="680" y="550" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#090D16">MontClip workflow</text>
  <text x="680" y="572" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#475569">State summary, then selected images</text>
  <rect x="680" y="586" width="320" height="34" fill="#3B82F6"/>
  <text x="696" y="608" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">State summary</text>
  <line x1="1006" y1="603" x2="1040" y2="603" stroke="#090D16" stroke-width="2"/>
  <polygon points="1050,603 1038,597 1038,609" fill="#090D16"/>
  <rect x="1060" y="586" width="36" height="34" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="1106" y="586" width="36" height="34" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1154" y="608" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#B45309">if needed</text>

  <!-- Footer notes -->
  <text x="60" y="668" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#090D16">No token or latency benchmark claimed.</text>
  <text x="60" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#334155">Local FFmpeg and browser compositor; external AI service is optional. Frames are rendered locally; interpreting them is up to the agent's model.</text>
