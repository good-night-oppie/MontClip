  <text x="1084" y="432" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#090D16">Browser compositor</text>
  <line x1="1084" y1="444" x2="1206" y2="444" stroke="#FCA5A5" stroke-width="1"/>
  <text x="1084" y="462" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#090D16">External AI</text>
  <text x="1084" y="480" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#090D16">service: optional</text>

