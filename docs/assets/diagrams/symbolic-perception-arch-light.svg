  <line x1="130" y1="506" x2="130" y2="294" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="130,284 124,296 136,296" fill="#F59E0B"/>
  <text x="200" y="408" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#B45309">images back</text>
