  <rect x="1010" y="185" width="120" height="14" fill="#3B82F6"/>
  <rect x="870" y="209" width="150" height="14" fill="#3B82F6"/>
  <rect x="1026" y="209" width="170" height="14" fill="#3B82F6"/>
