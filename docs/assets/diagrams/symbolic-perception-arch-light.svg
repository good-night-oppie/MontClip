  <line x1="540" y1="328" x2="540" y2="346" stroke="#F59E0B" stroke-width="2"/>
  <line x1="500" y1="346" x2="870" y2="346" stroke="#F59E0B" stroke-width="2"/>
  <line x1="500" y1="346" x2="500" y2="360" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="500,370 494,358 506,358" fill="#F59E0B"/>
