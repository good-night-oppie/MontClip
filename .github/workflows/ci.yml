name: CI

# DIAGNOSTIC BRANCH for #224 only (Deja). Never merged; no PR. Measures every exported frame on Linux:
# main's app.js against the fix, same runner image, Rea's frame-cadence-truth.cjs (unchanged, sha256 d856f384…).
on:
  workflow_dispatch:

jobs:
  cadence:
    name: cadence (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "fix"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Fetch the bundled FFmpeg (pinned LGPL build)
        run: node desktop/fetch-ffmpeg.cjs --platform linux-x64 --cache-dir .cache/ffmpeg
      - name: Use main's app.js
        if: matrix.version == 'main'
        run: git checkout 550a3bc9 -- app.js && git diff --stat HEAD
      - name: Frame cadence, 6 exports from 0 s and 6 from 3600 s
        run: |
          set -u
          sha256sum scripts/diag224/frame-cadence-truth.cjs
          D=$RUNNER_TEMP/data; mkdir -p $D/media $D/exports
          FF=$PWD/vendor/ffmpeg/linux-x64
          PORT=7790 FABLECUT_DATA_DIR=$D FABLECUT_NO_FS_WATCH=1 MONTCLIP_FFMPEG_DIR=$FF node server.js > $RUNNER_TEMP/server.log 2>&1 &
          sleep 3
          for off in 0 3600; do
            s=$(date +%s)
            BASE=http://127.0.0.1:7790 MEDIA=$D/media EXPORTS=$D/exports MONTCLIP_FFMPEG_DIR=$FF RUNS=6 OFFSET=$off node scripts/diag224/frame-cadence-truth.cjs || true
            echo "offset $off wall $(( $(date +%s) - s )) s"
          done
      - name: export-start-time.test.js, 5 times
        run: |
          pass=0; fail=0
          for i in 1 2 3 4 5; do
            if node --test test/export-start-time.test.js > $RUNNER_TEMP/est-$i.txt 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); fi
            grep -E "flashes [0-9]" $RUNNER_TEMP/est-$i.txt | head -1
          done
          echo "export-start-time: $pass passed, $fail failed"
