name: CI

# Every PR runs, draft or not, whatever branch it targets (Deja 2026-11-02: #28 is a draft and
# stacked PRs target other branches). Pushes to main run too, and it can be started by hand.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # GitHub merge queue (QQ, 2026-11-07; owner approved): the queue runs the same required checks on the
  # PR stacked on the latest main, so authors no longer re-merge main by hand.
  merge_group:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # A hung test file used to hold the job for GitHub's 6 hours; a normal run takes under 6 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest version package.json supports, the current LTS, and latest.
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      # MontClip runs only its bundled LGPL FFmpeg, never one on PATH. Fetch the
      # pinned build (SHA-256 and LGPL configuration are checked) so the tests that
      # need ffmpeg run against it. H.264 tests skip here: the runner has no
      # graphics-card encoder and no Windows h264_mf, and the LGPL build has no libx264.
      # One source of truth: desktop/ffmpeg-manifest.json. The archive is cached under a
      # key made from the manifest's hash, so it is downloaded again only when the pinned
      # build changes; fetch-ffmpeg checks the SHA-256 of a cached copy before using it.
      # A failed download fails the job: there is no fallback to the runner's ffmpeg.
      - name: Cache the pinned FFmpeg archive (key = manifest hash)
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ffmpeg
          key: ffmpeg-linux-x64-${{ hashFiles('desktop/ffmpeg-manifest.json') }}

      - name: Fetch the bundled FFmpeg (pinned LGPL build)
        run: |
          echo "archive cache hit: ${{ steps.ffmpeg-cache.outputs.cache-hit }}"
          start=$(date +%s)
          node desktop/fetch-ffmpeg.cjs --platform linux-x64 --cache-dir .cache/ffmpeg
          echo "fetch-ffmpeg took $(( $(date +%s) - start )) s"

      # No install step on purpose: MontClip has no runtime dependencies and the
      # suite uses only node:test. A missing `npm install` here is the feature.
      - name: Run the test suite
        run: npm test

  test-windows:
    # The H.264 export tests skip on the Linux runners (no graphics card, no h264_mf,
    # and the LGPL build has no H.264 software encoder). Windows has h264_mf, so they
    # run here against the bundled win32 build. MontClip is Windows-first.
    name: Tests (Windows, Node 22)
    runs-on: windows-latest
    # The slowest successful run of 161 took 6.8 minutes; two hung runs (2026-11-07) sat silent for 40 and 58.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Cache the pinned FFmpeg archive (key = manifest hash)
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ffmpeg
          key: ffmpeg-win32-x64-${{ hashFiles('desktop/ffmpeg-manifest.json') }}

      - name: Fetch the bundled FFmpeg (pinned LGPL build)
        run: |
          echo "archive cache hit: ${{ steps.ffmpeg-cache.outputs.cache-hit }}"
          node desktop/fetch-ffmpeg.cjs --platform win32-x64 --cache-dir .cache/ffmpeg

      - name: Run the test suite (skips listed)
        # --test-timeout: a test that hangs fails by its own name instead of silencing the whole job (the spec output
        # comes out file by file, so one stuck file hides every result after it). 5 minutes: the slowest test here
        # takes about 100 s (flv-packet-scan's fixture table); tests with their own timeout keep it.
        run: |
          node --test --test-timeout=300000 --test-reporter=tap --test-reporter-destination=windows.tap --test-reporter=spec --test-reporter-destination=stdout
          echo "skipped:"; grep '# SKIP' windows.tap | sed 's/.*# SKIP//' | sort | uniq -c || true

  check:
    name: Syntax & sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # Source checks moved into .github/scripts/ci-check.js (MontClip #281 prep PR):
      # it lists tracked .js with `git ls-files`, fails on zero/shrunk lists, and
      # carries the JSON and data-dir-split assertions word for word. Later phases
      # change only that script, never this workflow.
      - name: Source checks (syntax, JSON, data-dir split)
        run: node .github/scripts/ci-check.js

  release:
    # What a release will ship — checked here, before a release, instead of
    # after one. MontClip is not published to npm or the MCP registry (see
    # docs/decisions/2026-11-02-brand-montclip.md). See .github/scripts/release-check.js.
    name: Release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # release-check.js and the npm-pack list check run from ci-check.js --release
      # (MontClip #281 prep PR), so later phases change only that script.
      - name: Release readiness (release-check + npm-pack list)
        run: node .github/scripts/ci-check.js --release

      - name: Docs and playground are rebuilt from CLAUDE.md / the editor
        run: |
          node docs/docs/build.js
          node docs/demo/sync.js
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            git status --short -- docs/
            echo "::error::docs/ is stale — run node docs/docs/build.js and node docs/demo/sync.js, then commit"
            exit 1
          fi
